<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#3a1426; --bg2:#1d0912; --paper:#f7ede0; --ink:#3b2430; --wax:#b3263e; --gold:#e0b25c; --soft:#fbe9ec;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg1:#2c0f1d; --bg2:#12050b; } }
:root[data-theme="dark"]{ --bg1:#2c0f1d; --bg2:#12050b; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 20%,var(--bg1),var(--bg2) 75%);
  color:var(--soft); font-family:'Cormorant Garamond',Georgia,serif; overflow-x:hidden;
}
#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px}

/* Sobre */
.stage{width:min(92vw,420px);text-align:center}
.hint{font-size:1.35rem;font-style:italic;margin:0 0 22px;color:var(--soft)}
.envelope{position:relative;width:100%;aspect-ratio:3/2;background:#d9b99a;border-radius:6px;cursor:pointer;border:0;padding:0;
  box-shadow:0 18px 40px rgba(0,0,0,.45);transition:transform .5s ease}
.envelope:hover{transform:translateY(-4px)}
.envelope:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.envelope .body{position:absolute;inset:0;border-radius:6px;overflow:hidden;
  background:linear-gradient(135deg,transparent 49.5%,#c9a584 50%) left/50% 100% no-repeat,
             linear-gradient(225deg,transparent 49.5%,#c9a584 50%) right/50% 100% no-repeat,#d9b99a}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:#cfa987;transform-origin:top;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .7s ease,z-index 0s .35s;z-index:3}
.seal{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:var(--wax);z-index:4;display:grid;place-items:center;font-size:26px;color:#ffd9de;
  box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .3s,transform .4s}
.opened .flap{transform:rotateX(180deg);z-index:0}
.opened .seal{opacity:0;transform:scale(.4)}

/* Carta */
.letter{display:none;width:min(94vw,560px);background:var(--paper);color:var(--ink);border-radius:4px;
  padding:clamp(22px,5vw,40px);box-shadow:0 24px 60px rgba(0,0,0,.5);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(179,38,62,.12) 33px 34px)}
.letter.show{display:block;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.letter h1{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(2rem,7vw,2.8rem);margin:0 0 14px;color:var(--wax)}
#text{font-family:'Caveat',cursive;font-weight:500;font-size:clamp(1.35rem,4.6vw,1.65rem);line-height:34px;min-height:140px;white-space:pre-wrap;margin:0}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--wax);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sign{font-family:'Caveat',cursive;font-size:1.7rem;text-align:right;margin:18px 0 0;color:var(--wax);opacity:0;transition:opacity 1s}
.sign.show{opacity:1}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
button.btn{font:inherit;font-size:1.1rem;color:var(--ink);background:transparent;border:1.5px solid var(--wax);border-radius:999px;padding:8px 18px;cursor:pointer}
button.btn:hover{background:var(--wax);color:#fff}
button.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.btn[hidden]{display:none}

/* Música */
.music{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:5;display:flex;gap:8px;align-items:center}
.music button,.music label{font:inherit;font-size:1rem;color:var(--soft);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.music button:focus-visible,.music label:focus-within{outline:3px solid var(--gold)}
.music input{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="hearts" aria-hidden="true"></canvas>

<div class="music">
  <button id="musicBtn" type="button" aria-pressed="false">♪ Música</button>
  <label title="Usa tu propia canción (mp3)">Mi canción<input id="file" type="file" accept="audio/*"></label>
</div>

<main>
  <section class="stage" id="stage">
    <p class="hint">Tengo algo para ti…</p>
    <button class="envelope" id="envelope" type="button" aria-label="Abrir la carta">
      <div class="body"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </button>
  </section>

  <article class="letter" id="letter" aria-live="polite">
    <h1 id="title"></h1>
    <p id="text"></p>
    <p class="sign" id="sign"></p>
    <div class="actions">
      <button class="btn" id="skip" type="button">Mostrar todo</button>
      <button class="btn" id="again" type="button" hidden>Leer otra vez</button>
      <button class="btn" id="love" type="button" hidden>Enviar un abrazo ♥</button>
    </div>
  </article>
</main>

<script>
/* ===== EDITA AQUÍ TU CARTA ===== */
const CONFIG = {
  titulo: "Para mi amor,",
  parrafos: [
    "Hoy quise hacerte algo distinto, algo que pudieras abrir y guardar, porque tú mereces palabras que no se las lleve el chat.",
    "Gracias por tu paciencia, por tu risa y por hacer que los días normales se sientan especiales. A tu lado todo pesa menos y todo brilla más.",
    "No sé qué nos traerá el futuro, pero sé que quiero vivirlo contigo, tomados de la mano, con música de fondo y sin prisa.",
    "Te quiero muchísimo. Gracias por ser tú."
  ],
  firma: "Con todo mi cariño, tu novio ♥",
  velocidad: 38, // milisegundos por letra
  cancion: "Nuestra cancion.mp3" // opcional: tu canción incrustada (data:audio/mpeg;base64,...) o el nombre de un mp3 si lo alojas, ej. "musica.mp3"
};
/* =============================== */

const $ = id => document.getElementById(id);
const envelope = $('envelope'), letter = $('letter'), stage = $('stage');
const textEl = $('text'), signEl = $('sign');
const fullText = CONFIG.parrafos.join('\n\n');
let timer = null, idx = 0, finished = false;

$('title').textContent = CONFIG.titulo;
signEl.textContent = CONFIG.firma;

/* ---------- Escritura animada ---------- */
function render(upTo){
  textEl.textContent = fullText.slice(0, upTo);
  if(!finished){
    const c = document.createElement('span'); c.className = 'cursor'; textEl.appendChild(c);
  }
}
function finish(){
  clearInterval(timer); finished = true; idx = fullText.length; render(idx);
  signEl.classList.add('show');
  $('skip').hidden = true; $('again').hidden = false; $('love').hidden = false;
}
function startTyping(){
  clearInterval(timer); finished = false; idx = 0; render(0);
  signEl.classList.remove('show');
  $('skip').hidden = false; $('again').hidden = true; $('love').hidden = true;
  timer = setInterval(() => {
    idx++;
    if(idx >= fullText.length){ finish(); return; }
    render(idx);
  }, CONFIG.velocidad);
}

/* ---------- Abrir el sobre ---------- */
let opened = false;
function openLetter(){
  if(opened) return; opened = true;
  envelope.classList.add('opened');
  startMusic();
  setTimeout(() => {
    stage.style.display = 'none';
    letter.classList.add('show');
    startTyping();
    letter.scrollIntoView({behavior:'smooth', block:'center'});
  }, 800);
}
envelope.addEventListener('click', openLetter);
$('skip').addEventListener('click', finish);
$('again').addEventListener('click', startTyping);
$('love').addEventListener('click', () => burst(40));

/* ---------- Corazones flotantes ---------- */
const cv = $('hearts'), ctx = cv.getContext('2d');
let W, H, hearts = [];
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
function addHeart(x, y, burstMode){
  hearts.push({
    x: x ?? Math.random()*W, y: y ?? H + 20,
    s: 8 + Math.random()*16,
    vy: burstMode ? -(1.5 + Math.random()*3) : -(0.4 + Math.random()*0.9),
    vx: burstMode ? (Math.random()-.5)*4 : (Math.random()-.5)*0.4,
    a: .25 + Math.random()*.5, r: Math.random()*6.28
  });
}
function burst(n){ for(let i=0;i<n;i++) addHeart(W/2, H*0.6, true); }
function drawHeart(h){
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(Math.sin(h.r)*0.3);
  ctx.globalAlpha = h.a; ctx.fillStyle = '#e8506a'; ctx.beginPath();
  const s = h.s;
  ctx.moveTo(0, s*.3);
  ctx.bezierCurveTo(-s, -s*.5, -s*.5, -s, 0, -s*.35);
  ctx.bezierCurveTo(s*.5, -s, s, -s*.5, 0, s*.3);
  ctx.fill(); ctx.restore();
}
function loop(){
  ctx.clearRect(0,0,W,H);
  if(Math.random() < 0.06) addHeart();
  hearts = hearts.filter(h => h.y > -30 && h.x > -30 && h.x < W+30);
  hearts.forEach(h => { h.x += h.vx; h.y += h.vy; h.r += 0.02; drawHeart(h); });
  requestAnimationFrame(loop);
}
loop();
addEventListener('pointerdown', e => { for(let i=0;i<4;i++) addHeart(e.clientX, e.clientY, true); });

/* ---------- Música ---------- */
let actx = null, master = null, seqTimer = null, playing = false, customAudio = null;
const NOTE = {C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,E5:659.25};
/* Progresión suave: C – G – Am – F */
const PROG = [
  {bass:'C3', arp:['C4','E4','G4','E4','C5','G4','E4','G4']},
  {bass:'G3', arp:['B3','D4','G4','D4','B4','G4','D4','G4']},
  {bass:'A3', arp:['A3','C4','E4','C4','A4','E4','C4','E4']},
  {bass:'F3', arp:['A3','C4','F4','C4','A4','F4','C4','F4']}
];
let step = 0;
function tone(freq, t, dur, vol, type){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function schedule(){
  const beat = 0.42, bar = PROG[Math.floor(step/8) % PROG.length], i = step % 8, t = actx.currentTime + 0.05;
  if(i === 0) tone(NOTE[bar.bass], t, beat*8, 0.16, 'sine');
  tone(NOTE[bar.arp[i]], t, beat*1.8, 0.09, 'triangle');
  step++;
}
function startGenerated(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    actx = new AC(); master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
  }
  if(actx.state === 'suspended') actx.resume();
  clearInterval(seqTimer); seqTimer = setInterval(schedule, 420);
  return true;
}
function startMusic(){
  if(playing) return;
  if(customAudio){ customAudio.play().catch(()=>{}); playing = true; }
  else playing = startGenerated();
  setBtn();
}
function stopMusic(){
  clearInterval(seqTimer); if(customAudio) customAudio.pause();
  if(actx && actx.state === 'running') actx.suspend();
  playing = false; setBtn();
}
function setBtn(){
  const b = $('musicBtn');
  b.textContent = playing ? '♪ Pausar' : '♪ Música';
  b.setAttribute('aria-pressed', String(playing));
}
if(CONFIG.cancion){ customAudio = new Audio(CONFIG.cancion); customAudio.loop = true; customAudio.volume = 0.7; }
$('musicBtn').addEventListener('click', () => playing ? stopMusic() : startMusic());

$('file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  stopMusic();
  if(customAudio) URL.revokeObjectURL(customAudio.src);
  customAudio = new Audio(URL.createObjectURL(f)); customAudio.loop = true; customAudio.volume = 0.7;
  startMusic();
});
</script>
</body>
</html>
